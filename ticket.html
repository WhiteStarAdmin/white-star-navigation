<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Your White Star Ticket</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 25px 15px;

    background: #0b1b2b;

    color: white;

    font-family: Georgia, serif;

}

.ticket-page {

    width: 100%;

    max-width: 1200px;

    margin: 0 auto;

    text-align: center;

}

h1 {

    color: #c9a227;

    font-size: clamp(32px, 6vw, 55px);

    margin: 20px 0 5px;

}

h2 {

    font-size: clamp(22px, 4vw, 32px);

    margin: 0 0 25px;

}

hr {

    border: 0;

    border-top: 1px solid #777;

    margin: 25px 0;

}

#loadingMessage {

    font-size: 21px;

    margin: 45px 0;

}

#ticketArea {

    display: none;

}

.ticket-title {

    font-size: 28px;

    font-weight: bold;

    margin: 25px 0 10px;

}

.character {

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 20px;

}

.canvas-wrapper {

    width: 100%;

    overflow-x: auto;

    padding: 5px;

}

#ticketCanvas {

    display: block;

    width: 100%;

    max-width: 1100px;

    height: auto;

    margin: 0 auto;

}

.ticket-info {

    margin: 25px auto;

    font-size: 18px;

    line-height: 1.8;

}

.ticket-info strong {

    color: #c9a227;

}

.actions {

    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;

    margin: 25px 0;

}

button {

    padding: 13px 22px;

    font-size: 16px;

    border-radius: 6px;

    border: 1px solid #999;

    cursor: pointer;

}

#errorMessage {

    display: none;

    color: #ff7777;

    font-size: 19px;

    font-weight: bold;

    margin: 40px 0;

}

</style>

</head>


<body>


<main class="ticket-page">


<h1>
North Star Navigation
</h1>


<h2>
Your Passenger Ticket
</h2>


<hr>


<div id="loadingMessage">
Generating your ticket...
</div>


<div id="errorMessage"></div>


<section id="ticketArea">


<div class="ticket-title">
Ticket generated successfully.
</div>


<div
    id="characterDisplay"
    class="character"
></div>


<div class="canvas-wrapper">

<canvas id="ticketCanvas"></canvas>

</div>


<div
    id="ticketInfo"
    class="ticket-info"
></div>


<div class="actions">


<button
    type="button"
    id="downloadButton"
>
DOWNLOAD COMPLETE TICKET
</button>


<button
    type="button"
    id="lobbyButton"
>
ENTER LOBBY
</button>


</div>


</section>


<button
    type="button"
    onclick="window.location.href='index.html'"
>
← RETURN TO NAVIGATION
</button>


</main>


<script>

"use strict";


/* =========================================================
   ELEMENTS
   ========================================================= */

const loadingMessage =
    document.getElementById("loadingMessage");

const errorMessage =
    document.getElementById("errorMessage");

const ticketArea =
    document.getElementById("ticketArea");

const characterDisplay =
    document.getElementById("characterDisplay");

const ticketInfo =
    document.getElementById("ticketInfo");

const canvas =
    document.getElementById("ticketCanvas");

const ctx =
    canvas.getContext("2d");

const downloadButton =
    document.getElementById("downloadButton");

const lobbyButton =
    document.getElementById("lobbyButton");


/* =========================================================
   ERROR
   ========================================================= */

function showError(message) {

    loadingMessage.style.display = "none";

    ticketArea.style.display = "none";

    errorMessage.textContent = message;

    errorMessage.style.display = "block";

}


/* =========================================================
   PASSENGER
   ========================================================= */

const savedPassenger =
    localStorage.getItem("currentPassenger");


if (!savedPassenger) {

    showError(
        "No passenger registration was found."
    );

    throw new Error(
        "currentPassenger not found."
    );

}


let passengerData;


try {

    passengerData =
        JSON.parse(savedPassenger);

} catch (error) {

    showError(
        "The passenger registration is invalid."
    );

    throw error;

}


const passenger =
    String(
        passengerData.characterName || ""
    ).trim();


if (!passenger) {

    showError(
        "No Character Name was found."
    );

    throw new Error(
        "characterName missing."
    );

}


/* =========================================================
   CLASS
   ========================================================= */

function drawClass() {

    const random =
        Math.random() * 100;


    if (random < 15) {

        return "first";

    }


    if (random < 50) {

        return "second";

    }


    return "third";

}


/* =========================================================
   CLASS INFORMATION
   ========================================================= */

const classInformation = {

    first: {

        name: "FIRST",

        min: 1,

        max: 15,

        prefix: "AF"

    },

    second: {

        name: "SECOND",

        min: 16,

        max: 50,

        prefix: "DS"

    },

    third: {

        name: "THIRD",

        min: 51,

        max: 100,

        prefix: "GT"

    }

};


/* =========================================================
   GET USED ROOMS
   ========================================================= */

function getUsedRooms() {

    const stored =
        localStorage.getItem("usedRooms");


    if (!stored) {

        return [];

    }


    try {

        const rooms =
            JSON.parse(stored);


        if (
            Array.isArray(rooms)
        ) {

            return rooms;

        }

    } catch (error) {

        console.warn(
            "Could not read usedRooms."
        );

    }


    return [];

}


/* =========================================================
   SAVE USED ROOMS
   ========================================================= */

function saveUsedRooms(rooms) {

    localStorage.setItem(
        "usedRooms",
        JSON.stringify(rooms)
    );

}


/* =========================================================
   GET AVAILABLE ROOM
   ========================================================= */

function getAvailableRoom(className) {

    const information =
        classInformation[className];


    const usedRooms =
        getUsedRooms();


    const available =
        [];


    for (
        let number = information.min;
        number <= information.max;
        number++
    ) {

        if (
            !usedRooms.includes(number)
        ) {

            available.push(number);

        }

    }


    if (
        available.length === 0
    ) {

        return null;

    }


    const selected =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    usedRooms.push(selected);

    saveUsedRooms(usedRooms);


    return selected;

}


/* =========================================================
   FORMAT ROOM
   ========================================================= */

function formatRoom(number) {

    return String(number)
        .padStart(3, "0");

}


/* =========================================================
   DATE / TIME
   ========================================================= */

const now =
    new Date();


const day =
    String(
        now.getDate()
    ).padStart(2, "0");


const month =
    String(
        now.getMonth() + 1
    ).padStart(2, "0");


const year =
    now.getFullYear();


const hours =
    String(
        now.getHours()
    ).padStart(2, "0");


const minutes =
    String(
        now.getMinutes()
    ).padStart(2, "0");


const registrationDate =
    `${day}/${month}/${year}`;


const registrationTime =
    `${hours}:${minutes}`;


/* =========================================================
   GENERATE DATA
   ========================================================= */

const className =
    drawClass();


const classData =
    classInformation[className];


const roomNumber =
    getAvailableRoom(className);


if (roomNumber === null) {

    showError(
        "There are no available cabins in this class."
    );

    throw new Error(
        "No available cabin."
    );

}


const formattedRoom =
    formatRoom(roomNumber);


const cabin =
    `${className === "first" ? "A" :
       className === "second" ? "D" : "G"}-${formattedRoom}`;


const category =
    "PASAJERO";


const destination =
    "REMOTO";


const code =
    `${classData.prefix}-${day}${month}${formattedRoom}`;


/* =========================================================
   SAVE DATA
   ========================================================= */

const generatedTicket = {

    class:
        className,

    template:
        cabin.charAt(0),

    passenger:
        passenger,

    category:
        category,

    cabin:
        cabin,

    roomNumber:
        roomNumber,

    destination:
        destination,

    date:
        registrationDate,

    time:
        registrationTime,

    code:
        code

};


localStorage.setItem(
    "generatedTicket",
    JSON.stringify(
        generatedTicket
    )
);


/* =========================================================
   CANVAS
   ========================================================= */

const TICKET_WIDTH =
    1600;

const TICKET_HEIGHT =
    560;


canvas.width =
    TICKET_WIDTH;

canvas.height =
    TICKET_HEIGHT;


/* =========================================================
   TEXT HELPER
   ========================================================= */

function text(
    value,
    x,
    y,
    font,
    color,
    align = "left"
) {

    ctx.font =
        font;

    ctx.fillStyle =
        color;

    ctx.textAlign =
        align;

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        value,
        x,
        y
    );

}


/* =========================================================
   DRAW TICKET
   ========================================================= */

function drawTicket() {

    /* BACKGROUND */

    ctx.fillStyle =
        "#f3f3f0";

    ctx.fillRect(
        0,
        0,
        TICKET_WIDTH,
        TICKET_HEIGHT
    );


    /* OUTER BORDER */

    ctx.strokeStyle =
        "#181879";

    ctx.lineWidth =
        7;

    ctx.strokeRect(
        35,
        35,
        TICKET_WIDTH - 70,
        TICKET_HEIGHT - 70
    );


    /* INNER BORDER */

    ctx.strokeStyle =
        "#181879";

    ctx.lineWidth =
        2;

    ctx.strokeRect(
        55,
        55,
        TICKET_WIDTH - 110,
        TICKET_HEIGHT - 110
    );


    /* HEADER */

    text(
        "NORTH STAR NAVIGATION",
        800,
        95,
        "bold 32px Georgia, serif",
        "#171717",
        "center"
    );


    text(
        "NSN TITANIC  |  1912",
        800,
        140,
        "bold 20px Georgia, serif",
        "#171717",
        "center"
    );


    /* SEPARATOR */

    ctx.strokeStyle =
        "#171717";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.moveTo(
        105,
        165
    );

    ctx.lineTo(
        1120,
        165
    );

    ctx.stroke();


    /* LEFT PANEL */

    text(
        "PASAJERO:",
        110,
        225,
        "bold 24px Georgia, serif",
        "#171717"
    );

    text(
        passenger,
        360,
        225,
        "bold 24px Georgia, serif",
        "#171717"
    );


    text(
        "CATEGORÍA:",
        110,
        290,
        "bold 24px Georgia, serif",
        "#171717"
    );

    text(
        category,
        360,
        290,
        "bold 24px Georgia, serif",
        "#171717"
    );


    text(
        "CAMAROTE:",
        110,
        355,
        "bold 24px Georgia, serif",
        "#171717"
    );

    text(
        cabin,
        555,
        355,
        "bold 26px Georgia, serif",
        "#171717",
        "center"
    );


    text(
        "DESTINO:",
        110,
        420,
        "bold 24px Georgia, serif",
        "#171717"
    );

    text(
        destination,
        520,
        420,
        "bold 24px Georgia, serif",
        "#171717",
        "center"
    );


    /* RIGHT PANEL */

    ctx.strokeStyle =
        "#171717";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.moveTo(
        1120,
        75
    );

    ctx.lineTo(
        1120,
        485
    );

    ctx.stroke();


    /* CLASS */

    text(
        classData.name,
        1360,
        155,
        "bold 30px Georgia, serif",
        "#b21d1d",
        "center"
    );


    text(
        "CLASS",
        1360,
        195,
        "bold 20px Georgia, serif",
        "#171717",
        "center"
    );


    /* DATE */

    text(
        "DATE",
        1360,
        270,
        "bold 18px Georgia, serif",
        "#b21d1d",
        "center"
    );


    text(
        registrationDate,
        1360,
        310,
        "bold 22px Georgia, serif",
        "#171717",
        "center"
    );


    /* CODE */

    text(
        "CODE",
        1360,
        380,
        "bold 18px Georgia, serif",
        "#b21d1d",
        "center"
    );


    text(
        code,
        1360,
        420,
        "bold 22px Georgia, serif",
        "#171717",
        "center"
    );


    /* DECORATIVE BLUE MARK */

    ctx.strokeStyle =
        "#278bd1";

    ctx.lineWidth =
        6;

    ctx.strokeRect(
        1010,
        195,
        70,
        145
    );


    ctx.strokeRect(
        1025,
        210,
        40,
        115
    );


    /* DECORATIVE STARS */

    text(
        "★",
        1045,
        245,
        "22px Georgia, serif",
        "#278bd1",
        "center"
    );

    text(
        "★",
        1045,
        285,
        "22px Georgia, serif",
        "#278bd1",
        "center"
    );

    text(
        "★",
        1045,
        325,
        "22px Georgia, serif",
        "#278bd1",
        "center"
    );


    /* RED TICKET PERFORATIONS */

    for (
        let y = 100;
        y <= 460;
        y += 70
    ) {

        ctx.fillStyle =
            "#9e3b18";

        ctx.beginPath();

        ctx.arc(
            1150,
            y,
            13,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /* CLASS LABEL */

    text(
        classData.name,
        1300,
        500,
        "bold 16px Georgia, serif",
        "#555",
        "center"
    );

}


/* =========================================================
   DRAW
   ========================================================= */

drawTicket();


/* =========================================================
   SHOW
   ========================================================= */

loadingMessage.style.display =
    "none";

ticketArea.style.display =
    "block";


characterDisplay.textContent =
    "Character: " + passenger;


ticketInfo.innerHTML = `

    <strong>Class:</strong>
    ${classData.name}

    <br>

    <strong>Cabin:</strong>
    ${cabin}

    <br>

    <strong>Date:</strong>
    ${registrationDate}

    <br>

    <strong>Time:</strong>
    ${registrationTime}

    <br>

    <strong>Code:</strong>
    ${code}

`;


/* =========================================================
   DOWNLOAD
   ========================================================= */

downloadButton.addEventListener(
    "click",
    function () {

        const link =
            document.createElement("a");


        link.download =
            `North-Star-Ticket-${code}.png`;


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        document.body.appendChild(link);

        link.click();

        link.remove();

    }
);


/* =========================================================
   LOBBY
   ========================================================= */

lobbyButton.addEventListener(
    "click",
    function () {
        window.location.href =
            "https://chat.whatsapp.com/IQaoDWWWKtW6ohz2e7MEpU?s=cl&p=a&ilr=1";
    }
);
    
</script>

</body>

  </html>
