<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your White Star Ticket</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .ticket-page {
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }

        .ticket-wrapper {
            width: 100%;
            overflow-x: auto;
            margin: 25px auto;
        }

        #ticketCanvas {
            width: 100%;
            max-width: 1536px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .ticket-confirmation {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            border: 2px solid #c9a227;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .ticket-confirmation h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 26px;
        }

        .ticket-details {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.7;
        }

        .ticket-loading {
            font-size: 18px;
            margin: 30px;
        }

        .ticket-error {
            font-size: 18px;
            font-weight: bold;
            margin: 30px;
        }

        .ticket-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .ticket-actions button {
            padding: 12px 22px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>


<body>

<main class="ticket-page">

    <h1>North Star Navigation</h1>

    <h2>Your Passenger Ticket</h2>

    <hr>


    <p
        id="loadingMessage"
        class="ticket-loading"
    >
        Generating your ticket...
    </p>


    <!-- =====================================================
         CONFIRMATION BOX
         ===================================================== -->

    <section
        id="ticketConfirmation"
        class="ticket-confirmation"
        style="display:none;"
    >

        <h3>
            Ticket generated successfully.
        </h3>


        <!-- =================================================
             TICKET IMAGE
             ================================================= -->

        <div class="ticket-wrapper">

            <canvas
                id="ticketCanvas"
            ></canvas>

        </div>


        <!-- =================================================
             TICKET INFORMATION
             ================================================= -->

        <div
            id="ticketInfo"
            class="ticket-details"
        ></div>

    </section>


    <!-- =====================================================
         BUTTONS
         ===================================================== -->

    <div class="ticket-actions">

        <button
            type="button"
            id="downloadButton"
            style="display:none;"
        >
            DOWNLOAD TICKET
        </button>


        <button
            type="button"
            id="lobbyButton"
        >
            ENTER LOBBY
        </button>

    </div>


    <button
        type="button"
        onclick="window.location.href='index.html'"
    >
        ← RETURN TO NAVIGATION
    </button>


</main>


<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas =
    document.getElementById("ticketCanvas");

const ctx =
    canvas.getContext("2d");

const loadingMessage =
    document.getElementById("loadingMessage");

const ticketConfirmation =
    document.getElementById("ticketConfirmation");

const ticketInfo =
    document.getElementById("ticketInfo");

const downloadButton =
    document.getElementById("downloadButton");

const lobbyButton =
    document.getElementById("lobbyButton");


/* =========================================================
   GET PASSENGER
   ========================================================= */

const savedPassenger =
    localStorage.getItem("currentPassenger");


if (!savedPassenger) {

    loadingMessage.textContent =
        "No passenger registration was found.";

    lobbyButton.style.display = "none";

    throw new Error(
        "No passenger registration found."
    );

}


let passengerData;


try {

    passengerData =
        JSON.parse(savedPassenger);

} catch (error) {

    loadingMessage.textContent =
        "The passenger registration is invalid.";

    lobbyButton.style.display = "none";

    throw error;

}


/* =========================================================
   CHARACTER NAME
   ========================================================= */

const passenger =
    String(
        passengerData.characterName || ""
    ).trim();


if (!passenger) {

    loadingMessage.textContent =
        "A Character Name is required.";

    lobbyButton.style.display = "none";

    throw new Error(
        "Character Name is missing."
    );

}


/* =========================================================
   CLASS
   ========================================================= */

function drawClass() {

    const random =
        Math.random() * 100;


    if (random < 15) {

        return "first";

    }


    if (random < 50) {

        return "second";

    }


    return "third";

}


/* =========================================================
   TICKET TEMPLATES
   ========================================================= */

const ticketTemplates = {

    first: [

        {
            letter: "A",
            image: "./assets/tickets/ticket_first_a.png",
            prefix: "AF"
        },

        {
            letter: "B",
            image: "./assets/tickets/ticket_first_b.png",
            prefix: "BF"
        },

        {
            letter: "C",
            image: "./assets/tickets/ticket_first_c.png",
            prefix: "CF"
        }

    ],


    second: [

        {
            letter: "D",
            image: "./assets/tickets/ticket_second_d.png",
            prefix: "DS"
        },

        {
            letter: "E",
            image: "./assets/tickets/ticket_second_e.png",
            prefix: "ES"
        },

        {
            letter: "F",
            image: "./assets/tickets/ticket_second_f.png",
            prefix: "FS"
        }

    ],


    third: [

        {
            letter: "G",
            image: "./assets/tickets/ticket_third_g.png",
            prefix: "GT"
        },

        {
            letter: "H",
            image: "./assets/tickets/ticket_third_h.png",
            prefix: "HT"
        },

        {
            letter: "I",
            image: "./assets/tickets/ticket_third_i.png",
            prefix: "IT"
        }

    ]

};


/* =========================================================
   ROOM RANGES
   ========================================================= */

const roomRanges = {

    first: {
        min: 1,
        max: 15
    },

    second: {
        min: 16,
        max: 50
    },

    third: {
        min: 51,
        max: 100
    }

};


/* =========================================================
   USED ROOMS
   ========================================================= */

function getUsedRooms() {

    const stored =
        localStorage.getItem("usedRooms");


    if (!stored) {

        return [];

    }


    try {

        const rooms =
            JSON.parse(stored);


        if (Array.isArray(rooms)) {

            return rooms;

        }


        return [];

    } catch {

        return [];

    }

}


/* =========================================================
   SAVE ROOMS
   ========================================================= */

function saveUsedRooms(rooms) {

    localStorage.setItem(
        "usedRooms",
        JSON.stringify(rooms)
    );

}


/* =========================================================
   GET ROOM
   ========================================================= */

function getAvailableRoom(className) {

    const range =
        roomRanges[className];

    const usedRooms =
        getUsedRooms();

    const available = [];


    for (
        let number = range.min;
        number <= range.max;
        number++
    ) {

        if (
            !usedRooms.includes(number)
        ) {

            available.push(number);

        }

    }


    if (
        available.length === 0
    ) {

        return null;

    }


    const randomIndex =
        Math.floor(
            Math.random() *
            available.length
        );


    const room =
        available[randomIndex];


    usedRooms.push(room);

    saveUsedRooms(usedRooms);


    return room;

}


/* =========================================================
   FORMAT ROOM
   ========================================================= */

function formatRoomNumber(number) {

    return String(number)
        .padStart(3, "0");

}


/* =========================================================
   DATE AND TIME
   ========================================================= */

const now =
    new Date();


const day =
    String(
        now.getDate()
    ).padStart(2, "0");


const month =
    String(
        now.getMonth() + 1
    ).padStart(2, "0");


const year =
    now.getFullYear();


const hours =
    String(
        now.getHours()
    ).padStart(2, "0");


const minutes =
    String(
        now.getMinutes()
    ).padStart(2, "0");


const registrationDate =
    `${day}/${month}/${year}`;


const registrationTime =
    `${hours}:${minutes}`;


/* =========================================================
   GENERATE CLASS
   ========================================================= */

const className =
    drawClass();


/* =========================================================
   GENERATE ROOM
   ========================================================= */

const roomNumber =
    getAvailableRoom(className);


if (roomNumber === null) {

    loadingMessage.textContent =
        "There are no available places in this class.";

    lobbyButton.style.display = "none";

    throw new Error(
        "No available room."
    );

}


const formattedRoom =
    formatRoomNumber(roomNumber);


/* =========================================================
   SELECT TEMPLATE
   ========================================================= */

const templates =
    ticketTemplates[className];


const selectedTemplate =
    templates[
        Math.floor(
            Math.random() *
            templates.length
        )
    ];


/* =========================================================
   TICKET DATA
   ========================================================= */

const category =
    "PASAJERO";


const destination =
    "REMOTO";


const cabin =
    `${selectedTemplate.letter}-${formattedRoom}`;


const code =
    `${selectedTemplate.prefix}-${day}${month}${formattedRoom}`;


/* =========================================================
   LOAD TICKET IMAGE
   ========================================================= */

const ticketImage =
    new Image();


ticketImage.onload =
    function () {


        /* =================================================
           CANVAS SIZE
           ================================================= */

        canvas.width =
            ticketImage.naturalWidth;

        canvas.height =
            ticketImage.naturalHeight;


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* =================================================
           DRAW ORIGINAL PNG
           ================================================= */

        ctx.drawImage(
            ticketImage,
            0,
            0
        );


        /* =================================================
           TEXT SETTINGS
           ================================================= */

        ctx.fillStyle =
            "#171717";

        ctx.textBaseline =
            "middle";

        ctx.textAlign =
            "left";

        ctx.font =
            "bold 26px Georgia, serif";


        /* =================================================
           CHARACTER NAME
           ================================================= */

        ctx.fillText(
            passenger,
            355,
            219
        );


        /* =================================================
           CATEGORY
           ================================================= */

        ctx.fillText(
            category,
            355,
            275
        );


        /* =================================================
           CABIN
           ================================================= */

        ctx.fillText(
            cabin,
            555,
            330
        );


        /* =================================================
           DESTINATION
           ================================================= */

        ctx.fillText(
            destination,
            525,
            386
        );


        /* =================================================
           RIGHT PANEL
           ================================================= */

        ctx.textAlign =
            "center";

        ctx.font =
            "bold 24px Georgia, serif";


        /* DATE */

        ctx.fillText(
            registrationDate,
            1300,
            320
        );


        /* CODE */

        ctx.fillText(
            code,
            1300,
            418
        );


        ctx.textAlign =
            "left";


        /* =================================================
           SAVE DATA
           ================================================= */

        const generatedTicket = {

            class:
                className,

            template:
                selectedTemplate.letter,

            passenger:
                passenger,

            category:
                category,

            cabin:
                cabin,

            roomNumber:
                roomNumber,

            destination:
                destination,

            date:
                registrationDate,

            time:
                registrationTime,

            code:
                code

        };


        localStorage.setItem(
            "generatedTicket",
            JSON.stringify(
                generatedTicket
            )
        );


        /* =================================================
           SHOW CONFIRMATION
           ================================================= */

        loadingMessage.style.display =
            "none";


        ticketConfirmation.style.display =
            "block";


        downloadButton.style.display =
            "inline-block";


        ticketInfo.innerHTML = `

            <strong>
                Character:
            </strong>
            ${escapeHTML(passenger)}

            <br>

            <strong>
                Class:
            </strong>
            ${className.toUpperCase()}

            <br>

            <strong>
                Cabin:
            </strong>
            ${cabin}

            <br>

            <strong>
                Date:
            </strong>
            ${registrationDate}

            <br>

            <strong>
                Time:
            </strong>
            ${registrationTime}

            <br>

            <strong>
                Code:
            </strong>
            ${code}

        `;

    };


/* =========================================================
   IMAGE ERROR
   ========================================================= */

ticketImage.onerror =
    function () {

        loadingMessage.textContent =
            "The ticket image could not be loaded.";

        loadingMessage.className =
            "ticket-error";

        downloadButton.style.display =
            "none";

        ticketConfirmation.style.display =
            "none";

        console.error(
            "Ticket image failed:",
            selectedTemplate.image
        );

    };


/* =========================================================
   ESCAPE TEXT
   ========================================================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   START IMAGE LOAD
   ========================================================= */

ticketImage.src =
    selectedTemplate.image;


/* =========================================================
   DOWNLOAD COMPLETE TICKET
   ========================================================= */

downloadButton.addEventListener(
    "click",
    function () {

        /*
         * Create a second canvas containing:
         *
         * 1. Confirmation background
         * 2. Character name
         * 3. Ticket
         * 4. Ticket information
         */

        const downloadCanvas =
            document.createElement("canvas");


        const downloadCtx =
            downloadCanvas.getContext("2d");


        const width =
            1600;


        const height =
            950;


        downloadCanvas.width =
            width;

        downloadCanvas.height =
            height;


        /* Background */

        downloadCtx.fillStyle =
            "#0b1b2b";

        downloadCtx.fillRect(
            0,
            0,
            width,
            height
        );


        /* Border */

        downloadCtx.strokeStyle =
            "#c9a227";

        downloadCtx.lineWidth =
            4;

        downloadCtx.strokeRect(
            25,
            25,
            width - 50,
            height - 50
        );


        /* Title */

        downloadCtx.fillStyle =
            "#ffffff";

        downloadCtx.textAlign =
            "center";

        downloadCtx.font =
            "bold 42px Georgia, serif";

        downloadCtx.fillText(
            "NORTH STAR NAVIGATION",
            width / 2,
            85
        );


        /* Character */

        downloadCtx.font =
            "bold 30px Georgia, serif";

        downloadCtx.fillText(
            "Character: " + passenger,
            width / 2,
            135
        );


        /* Ticket */

        const ticketWidth =
            1350;


        const ticketHeight =
            ticketImage.naturalHeight *
            (
                ticketWidth /
                ticketImage.naturalWidth
            );


        downloadCtx.drawImage(
            ticketImage,
            (width - ticketWidth) / 2,
            170,
            ticketWidth,
            ticketHeight
        );


        /* Information */

        downloadCtx.fillStyle =
            "#ffffff";

        downloadCtx.font =
            "22px Georgia, serif";


        const infoY =
            800;


        downloadCtx.fillText(
            `Class: ${className.toUpperCase()}   |   Cabin: ${cabin}`,
            width / 2,
            infoY
        );


        downloadCtx.fillText(
            `Date: ${registrationDate}   |   Time: ${registrationTime}`,
            width / 2,
            infoY + 35
        );


        downloadCtx.fillText(
            `Code: ${code}`,
            width / 2,
            infoY + 70
        );


        /* Download */

        const link =
            document.createElement("a");


        link.download =
            `White-Star-Ticket-${code}.png`;


        link.href =
            downloadCanvas.toDataURL(
                "image/png"
            );


        link.click();

    }
);
