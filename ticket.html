<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your White Star Ticket</title>

    <style>

        body {
            margin: 0;
            background: #0d1b2a;
            color: #f5f1e8;
            font-family: Georgia, serif;
            text-align: center;
        }

        .ticket-page {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 15px 50px;
            box-sizing: border-box;
        }

        h1 {
            color: #d4af37;
            font-size: 52px;
            margin: 15px 0 0;
        }

        h2 {
            font-size: 34px;
            font-weight: normal;
            margin: 10px 0 35px;
        }

        hr {
            border: 0;
            border-top: 1px solid rgba(255,255,255,.25);
            margin-bottom: 30px;
        }

        .ticket-loading {
            font-size: 20px;
            margin: 30px 0;
        }

        .ticket-wrapper {
            width: 100%;
            overflow-x: auto;
            margin: 25px auto;
        }

        #ticketCanvas {
            display: block;
            width: 100%;
            max-width: 1536px;
            height: auto;
            margin: 0 auto;
        }

        .ticket-info {
            max-width: 700px;
            margin: 25px auto;
            font-size: 20px;
            line-height: 1.6;
        }

        .ticket-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .ticket-actions button,
        .return-button {
            padding: 14px 28px;
            font-size: 17px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #888;
            background: #f1f1f1;
            color: #111;
        }

        .return-button {
            margin-top: 5px;
        }

        button:hover {
            opacity: .9;
        }

    </style>

</head>


<body>

<main class="ticket-page">

    <h1>North Star Navigation</h1>

    <h2>Your Passenger Ticket</h2>

    <hr>


    <p
        id="loadingMessage"
        class="ticket-loading"
    >
        Generating your ticket...
    </p>


    <div class="ticket-wrapper">

        <canvas id="ticketCanvas"></canvas>

    </div>


    <div
        id="ticketInfo"
        class="ticket-info"
    ></div>


    <div class="ticket-actions">

        <button
            type="button"
            id="downloadButton"
        >
            DOWNLOAD TICKET
        </button>


        <button
            type="button"
            id="lobbyButton"
        >
            ENTER LOBBY
        </button>

    </div>


    <button
        type="button"
        class="return-button"
        onclick="location.href='index.html'"
    >
        ← RETURN TO NAVIGATION
    </button>

</main>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const canvas =
    document.getElementById("ticketCanvas");

const ctx =
    canvas.getContext("2d");

const loadingMessage =
    document.getElementById("loadingMessage");

const ticketInfo =
    document.getElementById("ticketInfo");

const downloadButton =
    document.getElementById("downloadButton");

const lobbyButton =
    document.getElementById("lobbyButton");


/* =========================================================
   OBTENER PASAJERO
   ========================================================= */

const savedPassenger =
    localStorage.getItem("currentPassenger");


if (!savedPassenger) {

    loadingMessage.textContent =
        "No registration was found.";

    downloadButton.style.display = "none";

    lobbyButton.style.display = "none";

    throw new Error(
        "No passenger registration found."
    );

}


const passengerData =
    JSON.parse(savedPassenger);


/* =========================================================
   SI YA EXISTE UN BOLETO GENERADO
   NO CREAR OTRO AL RECARGAR
   ========================================================= */

const savedTicket =
    localStorage.getItem("generatedTicket");


/* =========================================================
   CLASE
   ========================================================= */

function drawClass() {

    const random =
        Math.random() * 100;

    if (random < 15) {
        return "first";
    }

    if (random < 50) {
        return "second";
    }

    return "third";
}


/* =========================================================
   PLANTILLAS
   ========================================================= */

const ticketTemplates = {

    first: [

        {
            letter: "A",
            image:
                "assets/tickets/ticket_first_a.png",
            prefix: "AF"
        },

        {
            letter: "B",
            image:
                "assets/tickets/ticket_first_b.png",
            prefix: "BF"
        },

        {
            letter: "C",
            image:
                "assets/tickets/ticket_first_c.png",
            prefix: "CF"
        }

    ],


    second: [

        {
            letter: "D",
            image:
                "assets/tickets/ticket_second_d.png",
            prefix: "DS"
        },

        {
            letter: "E",
            image:
                "assets/tickets/ticket_second_e.png",
            prefix: "ES"
        },

        {
            letter: "F",
            image:
                "assets/tickets/ticket_second_f.png",
            prefix: "FS"
        }

    ],


    third: [

        {
            letter: "G",
            image:
                "assets/tickets/ticket_third_g.png",
            prefix: "GT"
        },

        {
            letter: "H",
            image:
                "assets/tickets/ticket_third_h.png",
            prefix: "HT"
        },

        {
            letter: "I",
            image:
                "assets/tickets/ticket_third_i.png",
            prefix: "IT"
        }

    ]

};


/* =========================================================
   RANGOS DE CAMAROTES
   ========================================================= */

const roomRanges = {

    first: {
        min: 1,
        max: 15
    },

    second: {
        min: 16,
        max: 50
    },

    third: {
        min: 51,
        max: 100
    }

};


/* =========================================================
   CAMAROTES UTILIZADOS
   ========================================================= */

function getUsedRooms() {

    const stored =
        localStorage.getItem("usedRooms");

    if (!stored) {
        return [];
    }

    try {

        return JSON.parse(stored);

    } catch {

        return [];

    }

}


function saveUsedRooms(rooms) {

    localStorage.setItem(
        "usedRooms",
        JSON.stringify(rooms)
    );

}


function getAvailableRoom(className) {

    const range =
        roomRanges[className];

    const usedRooms =
        getUsedRooms();

    const available = [];


    for (
        let number = range.min;
        number <= range.max;
        number++
    ) {

        if (
            !usedRooms.includes(number)
        ) {

            available.push(number);

        }

    }


    if (
        available.length === 0
    ) {

        return null;

    }


    const randomIndex =
        Math.floor(
            Math.random() *
            available.length
        );


    const room =
        available[randomIndex];


    usedRooms.push(room);

    saveUsedRooms(usedRooms);


    return room;

}


/* =========================================================
   FORMATO DEL CAMAROTE
   ========================================================= */

function formatRoomNumber(number) {

    return String(number)
        .padStart(3, "0");

}


/* =========================================================
   FECHA
   ========================================================= */

const now =
    new Date();


const day =
    String(now.getDate())
        .padStart(2, "0");


const month =
    String(now.getMonth() + 1)
        .padStart(2, "0");


const year =
    now.getFullYear();


const hours =
    String(now.getHours())
        .padStart(2, "0");


const minutes =
    String(now.getMinutes())
        .padStart(2, "0");


const registrationDate =
    `${day}/${month}/${year}`;


const registrationTime =
    `${hours}:${minutes}`;


/* =========================================================
   GENERAR DATOS
   ========================================================= */

let generatedTicket;


/*
   Si ya existe un boleto para este registro,
   reutilizarlo.
*/

if (savedTicket) {

    generatedTicket =
        JSON.parse(savedTicket);

}


/* =========================================================
   CREAR NUEVO BOLETO
   ========================================================= */

if (!generatedTicket) {


    const className =
        drawClass();


    const roomNumber =
        getAvailableRoom(className);


    if (roomNumber === null) {

        loadingMessage.textContent =
            "There are no available places in this class.";

        downloadButton.style.display =
            "none";

        lobbyButton.style.display =
            "none";

        throw new Error(
            "No available room."
        );

    }


    const formattedRoom =
        formatRoomNumber(
            roomNumber
        );


    const templates =
        ticketTemplates[className];


    const selectedTemplate =
        templates[
            Math.floor(
                Math.random() *
                templates.length
            )
        ];


    /* -----------------------------------------------------
       DATOS
       ----------------------------------------------------- */

    const passenger =
        passengerData.characterName ||
        "PASAJERO";


    const category =
        passengerData.category ||
        "PASAJERO";


    const destination =
        passengerData.destination ||
        "REMOTO";


    const cabin =
        `${selectedTemplate.letter}-${formattedRoom}`;


    /*
       Código completo.
    */

    const code =
        `${selectedTemplate.prefix}-${day}${month}${formattedRoom}`;


    /*
       Guardar todo.
    */

    generatedTicket = {

        class:
            className,

        template:
            selectedTemplate.letter,

        image:
            selectedTemplate.image,

        prefix:
            selectedTemplate.prefix,

        passenger:
            passenger,

        category:
            category,

        cabin:
            cabin,

        roomNumber:
            roomNumber,

        destination:
            destination,

        date:
            registrationDate,

        time:
            registrationTime,

        code:
            code

    };


    localStorage.setItem(
        "generatedTicket",
        JSON.stringify(
            generatedTicket
        )
    );

}


/* =========================================================
   MOSTRAR BOLETO
   ========================================================= */

const ticketImage =
    new Image();


ticketImage.onload =
    function () {


        /* -------------------------------------------------
           TAMAÑO REAL DEL PNG
           ------------------------------------------------- */

        canvas.width =
            ticketImage.naturalWidth;

        canvas.height =
            ticketImage.naturalHeight;


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* -------------------------------------------------
           IMAGEN BASE
           ------------------------------------------------- */

        ctx.drawImage(
            ticketImage,
            0,
            0
        );


        /* =================================================
           CONFIGURACIÓN DEL TEXTO
           ================================================= */

        ctx.fillStyle =
            "#171717";

        ctx.textBaseline =
            "middle";

        ctx.textAlign =
            "left";

        ctx.font =
            "bold 26px Georgia, serif";


        /* =================================================
           PASAJERO
           ================================================= */

        ctx.fillText(
            generatedTicket.passenger,
            355,
            219
        );


        /* =================================================
           CATEGORÍA
           ================================================= */

        ctx.fillText(
            generatedTicket.category,
            355,
            275
        );


        /* =================================================
           CAMAROTE
           ================================================= */

        ctx.fillText(
            generatedTicket.cabin,
            555,
            330
        );


        /* =================================================
           DESTINO
           ================================================= */

        ctx.fillText(
            generatedTicket.destination,
            525,
            386
        );


        /* =================================================
           FECHA — PANEL DERECHO
           ================================================= */

        ctx.font =
            "bold 24px Georgia, serif";

        ctx.textAlign =
            "center";

        ctx.fillText(
            generatedTicket.date,
            1300,
            288
        );


        /* =================================================
           CÓDIGO — PANEL DERECHO
           
           IMPORTANTE:
           El PNG YA TIENE "AF-", "BF-", etc.
           Por eso aquí solamente ponemos
           la parte numérica.
           ================================================= */

        const codeNumber =
            generatedTicket.code
                .split("-")
                .slice(1)
                .join("-");


        ctx.fillText(
            codeNumber,
            1300,
            382
        );


        ctx.textAlign =
            "left";


        /* =================================================
           INFORMACIÓN DEBAJO
           ================================================= */

        loadingMessage.style.display =
            "none";


        ticketInfo.innerHTML = `

            <strong>
                Ticket generated successfully.
            </strong>

            <br>

            Class:
            ${generatedTicket.class.toUpperCase()}

            <br>

            Cabin:
            ${generatedTicket.cabin}

            <br>

            Date:
            ${generatedTicket.date}

            <br>

            Time:
            ${generatedTicket.time}

            <br>

            Code:
            ${generatedTicket.code}

        `;

    };


/* =========================================================
   ERROR DE IMAGEN
   ========================================================= */

ticketImage.onerror =
    function () {

        loadingMessage.textContent =
            "The ticket image could not be loaded.";

        downloadButton.style.display =
            "none";

        lobbyButton.style.display =
            "none";

    };


/* =========================================================
   CARGAR PNG
   ========================================================= */

ticketImage.src =
    generatedTicket.image;


/* =========================================================
   DESCARGAR PNG
   ========================================================= */

downloadButton.addEventListener(
    "click",
    function () {

        if (
            !canvas.width ||
            !canvas.height
        ) {

            alert(
                "The ticket is still generating."
            );

            return;

        }


        const link =
            document.createElement("a");


        link.download =
            `White-Star-Ticket-${generatedTicket.code}.png`;


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        link.click();

    }
);


/* =========================================================
   LOBBY
   ========================================================= */

lobbyButton.addEventListener(
    "click",
    function () {

        window.location.href =
            "index.html";

    }
);

</script>

</body>

</html>
