<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your White Star Ticket</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<main
    class="ticket-page"
    style="
        max-width:1100px;
        margin:0 auto;
        text-align:center;
    "
>

    <h1>North Star Navigation</h1>

    <h2>Your Passenger Ticket</h2>

    <hr>


    <p
        id="loadingMessage"
        style="
            font-size:18px;
            margin:30px;
        "
    >
        Generating your ticket...
    </p>


    <div
        style="
            width:100%;
            overflow-x:auto;
            margin:25px auto;
        "
    >

        <canvas
            id="ticketCanvas"
            style="
                width:100%;
                max-width:1536px;
                height:auto;
                display:block;
                margin:0 auto;
            "
        ></canvas>

    </div>


    <div
        id="ticketInfo"
        style="
            margin:15px auto;
            max-width:700px;
        "
    ></div>


    <div
        style="
            display:flex;
            justify-content:center;
            gap:12px;
            flex-wrap:wrap;
            margin:25px 0;
        "
    >

        <button
            type="button"
            id="downloadButton"
            style="
                padding:12px 22px;
                font-size:16px;
                cursor:pointer;
            "
        >
            DOWNLOAD TICKET
        </button>


        <button
            type="button"
            id="lobbyButton"
            style="
                padding:12px 22px;
                font-size:16px;
                cursor:pointer;
            "
        >
            ENTER LOBBY
        </button>

    </div>


    <button
        type="button"
        onclick="location.href='index.html'"
        style="
            padding:10px 20px;
            font-size:16px;
            cursor:pointer;
        "
    >
        ← RETURN TO NAVIGATION
    </button>


</main>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const canvas =
    document.getElementById("ticketCanvas");

const ctx =
    canvas.getContext("2d");

const loadingMessage =
    document.getElementById("loadingMessage");

const ticketInfo =
    document.getElementById("ticketInfo");

const downloadButton =
    document.getElementById("downloadButton");

const lobbyButton =
    document.getElementById("lobbyButton");


/* =========================================================
   PASAJERO
   ========================================================= */

const savedPassenger =
    localStorage.getItem("currentPassenger");


if (!savedPassenger) {

    loadingMessage.textContent =
        "No registration was found.";

    downloadButton.style.display =
        "none";

    lobbyButton.style.display =
        "none";

    throw new Error(
        "No passenger registration found."
    );
}


const passengerData =
    JSON.parse(savedPassenger);


/* =========================================================
   CLASE
   ========================================================= */

function drawClass() {

    const random =
        Math.random() * 100;

    if (random < 15) {

        return "first";

    }

    if (random < 50) {

        return "second";

    }

    return "third";

}


/* =========================================================
   BOLETOS
   ========================================================= */

const ticketTemplates = {

    first: [

        {
            letter: "A",
            image: "assets/tickets/ticket_first_a.png",
            prefix: "AF"
        },

        {
            letter: "B",
            image: "assets/tickets/ticket_first_b.png",
            prefix: "BF"
        },

        {
            letter: "C",
            image: "assets/tickets/ticket_first_c.png",
            prefix: "CF"
        }

    ],


    second: [

        {
            letter: "D",
            image: "assets/tickets/ticket_second_d.png",
            prefix: "DS"
        },

        {
            letter: "E",
            image: "assets/tickets/ticket_second_e.png",
            prefix: "ES"
        },

        {
            letter: "F",
            image: "assets/tickets/ticket_second_f.png",
            prefix: "FS"
        }

    ],


    third: [

        {
            letter: "G",
            image: "assets/tickets/ticket_third_g.png",
            prefix: "GT"
        },

        {
            letter: "H",
            image: "assets/tickets/ticket_third_h.png",
            prefix: "HT"
        },

        {
            letter: "I",
            image: "assets/tickets/ticket_third_i.png",
            prefix: "IT"
        }

    ]

};


/* =========================================================
   RANGOS DE CAMAROTES
   ========================================================= */

const roomRanges = {

    first: {
        min: 1,
        max: 15
    },

    second: {
        min: 16,
        max: 50
    },

    third: {
        min: 51,
        max: 100
    }

};


/* =========================================================
   CAMAROTE
   ========================================================= */

function getUsedRooms() {

    const stored =
        localStorage.getItem("usedRooms");

    if (!stored) {

        return [];

    }

    return JSON.parse(stored);

}


function saveUsedRooms(rooms) {

    localStorage.setItem(
        "usedRooms",
        JSON.stringify(rooms)
    );

}


function getAvailableRoom(className) {

    const range =
        roomRanges[className];

    const usedRooms =
        getUsedRooms();

    const available = [];


    for (
        let number = range.min;
        number <= range.max;
        number++
    ) {

        if (
            !usedRooms.includes(number)
        ) {

            available.push(number);

        }

    }


    if (
        available.length === 0
    ) {

        return null;

    }


    const randomIndex =
        Math.floor(
            Math.random() *
            available.length
        );


    const room =
        available[randomIndex];


    usedRooms.push(room);

    saveUsedRooms(usedRooms);


    return room;

}


/* =========================================================
   FORMATO DEL CAMAROTE
   ========================================================= */

function formatRoomNumber(number) {

    return String(number)
        .padStart(3, "0");

}


/* =========================================================
   FECHA Y HORA
   ========================================================= */

const now =
    new Date();


const day =
    String(now.getDate())
        .padStart(2, "0");


const month =
    String(now.getMonth() + 1)
        .padStart(2, "0");


const year =
    now.getFullYear();


const hours =
    String(now.getHours())
        .padStart(2, "0");


const minutes =
    String(now.getMinutes())
        .padStart(2, "0");


const registrationDate =
    `${day}/${month}/${year}`;


const registrationTime =
    `${hours}:${minutes}`;


/* =========================================================
   GENERAR CLASE
   ========================================================= */

const className =
    drawClass();


/* =========================================================
   GENERAR CAMAROTE
   ========================================================= */

const roomNumber =
    getAvailableRoom(className);


if (roomNumber === null) {

    loadingMessage.textContent =
        "There are no available places in this class.";

    downloadButton.style.display =
        "none";

    lobbyButton.style.display =
        "none";

    throw new Error(
        "No available room in selected class."
    );

}


const formattedRoom =
    formatRoomNumber(roomNumber);


/* =========================================================
   SELECCIONAR BOLETO
   ========================================================= */

const templates =
    ticketTemplates[className];


const selectedTemplate =
    templates[
        Math.floor(
            Math.random() *
            templates.length
        )
    ];


/* =========================================================
   DATOS DEL BOLETO
   ========================================================= */

const passenger =
    passengerData.characterName ||
    "PASAJERO";


const category =
    "PASAJERO";


const destination =
    passengerData.destination ||
    "REMOTO";


const cabin =
    `${selectedTemplate.letter}-${formattedRoom}`;


const code =
    `${selectedTemplate.prefix}-${day}${month}${formattedRoom}`;


/* =========================================================
   IMAGEN
   ========================================================= */

const ticketImage =
    new Image();


ticketImage.onload =
    function () {


        /* -----------------------------------------------
           DIMENSIONES ORIGINALES
           ----------------------------------------------- */

        canvas.width =
            ticketImage.naturalWidth;

        canvas.height =
            ticketImage.naturalHeight;


        /* -----------------------------------------------
           LIMPIAR
           ----------------------------------------------- */

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* -----------------------------------------------
           BOLETO
           ----------------------------------------------- */

        ctx.drawImage(
            ticketImage,
            0,
            0
        );


        /* =================================================
           TEXTO DEL BOLETO
           ================================================= */

        ctx.fillStyle =
            "#171717";

        ctx.textBaseline =
            "middle";

        ctx.textAlign =
            "left";


        /* -----------------------------------------------
           PASAJERO
           ----------------------------------------------- */

        ctx.font =
            "bold 26px Georgia, serif";

        ctx.fillText(
            passenger,
            355,
            219
        );


        /* -----------------------------------------------
           CATEGORÍA
           ----------------------------------------------- */

        ctx.fillText(
            category,
            355,
            275
        );


        /* -----------------------------------------------
           CAMAROTE
           ----------------------------------------------- */

        ctx.fillText(
            cabin,
            555,
            330
        );


        /* -----------------------------------------------
           DESTINO
           ----------------------------------------------- */

        ctx.fillText(
            destination,
            525,
            386
        );


        /* =================================================
           PANEL DERECHO
           ================================================= */

        ctx.font =
            "bold 24px Georgia, serif";

        ctx.textAlign =
            "center";


        /* -----------------------------------------------
           FECHA
           ----------------------------------------------- */

        ctx.fillText(
            registrationDate,
            1300,
            320
        );


        /* -----------------------------------------------
           CÓDIGO
           ----------------------------------------------- */

        ctx.fillText(
            code,
            1300,
            418
        );


        /* -----------------------------------------------
           RESTABLECER ALINEACIÓN
           ----------------------------------------------- */

        ctx.textAlign =
            "left";


        /* =================================================
           GUARDAR INFORMACIÓN
           ================================================= */

        const generatedTicket = {

            class:
                className,

            template:
                selectedTemplate.letter,

            passenger:
                passenger,

            category:
                category,

            cabin:
                cabin,

            roomNumber:
                roomNumber,

            destination:
                destination,

            date:
                registrationDate,

            time:
                registrationTime,

            code:
                code

        };


        localStorage.setItem(
            "generatedTicket",
            JSON.stringify(
                generatedTicket
            )
        );


        /* =================================================
           MOSTRAR INFORMACIÓN
           ================================================= */

        loadingMessage.style.display =
            "none";


        ticketInfo.innerHTML = `

            <strong>
                Ticket generated successfully.
            </strong>

            <br>

            Class:
            ${className.toUpperCase()}

            <br>

            Cabin:
            ${cabin}

            <br>

            Date:
            ${registrationDate}

            <br>

            Time:
            ${registrationTime}

            <br>

            Code:
            ${code}

        `;

    };


/* =========================================================
   ERROR DE IMAGEN
   ========================================================= */

ticketImage.onerror =
    function () {

        loadingMessage.textContent =
            "The ticket image could not be loaded.";

        downloadButton.style.display =
            "none";

        lobbyButton.style.display =
            "none";

    };


ticketImage.src =
    selectedTemplate.image;


/* =========================================================
   DESCARGAR PNG
   ========================================================= */

downloadButton.addEventListener(
    "click",
    function () {

        const link =
            document.createElement("a");


        link.download =
            `White-Star-Ticket-${code}.png`;


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        link.click();

    }
);


/* =========================================================
   LOBBY
   ========================================================= */

lobbyButton.addEventListener(
    "click",
    function () {

        window.location.href =
            "index.html";

    }
);

</script>

</body>

    </html>
