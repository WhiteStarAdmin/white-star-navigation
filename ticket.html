<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your White Star Ticket</title>


    <style>

        body {
            margin: 0;
            background: #0d1b2a;
            color: #f5f1e8;
            font-family: Georgia, serif;
            text-align: center;
        }


        .ticket-page {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 15px 50px;
            box-sizing: border-box;
        }


        h1 {
            color: #d4af37;
            font-size: 52px;
            margin: 15px 0 0;
        }


        h2 {
            font-size: 34px;
            font-weight: normal;
            margin: 10px 0 35px;
        }


        hr {
            border: 0;
            border-top: 1px solid rgba(255,255,255,.25);
            margin-bottom: 30px;
        }


        .ticket-loading {
            font-size: 20px;
            margin: 30px 0;
        }


        .ticket-wrapper {
            width: 100%;
            overflow-x: auto;
            margin: 25px auto;
        }


        #ticketCanvas {
            display: block;
            width: 100%;
            max-width: 1536px;
            height: auto;
            margin: 0 auto;
        }


        .ticket-info {
            max-width: 700px;
            margin: 25px auto;
            font-size: 20px;
            line-height: 1.6;
        }


        .ticket-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px 0;
        }


        .ticket-actions button,
        .return-button {
            padding: 14px 28px;
            font-size: 17px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #888;
            background: #f1f1f1;
            color: #111;
        }


        .return-button {
            margin-top: 5px;
        }

    </style>

</head>


<body>


<main class="ticket-page">


    <h1>
        North Star Navigation
    </h1>


    <h2>
        Your Passenger Ticket
    </h2>


    <hr>


    <p
        id="loadingMessage"
        class="ticket-loading"
    >
        Generating your ticket...
    </p>


    <div class="ticket-wrapper">

        <canvas id="ticketCanvas"></canvas>

    </div>


    <div
        id="ticketInfo"
        class="ticket-info"
    ></div>


    <div class="ticket-actions">


        <button
            type="button"
            id="downloadButton"
        >
            DOWNLOAD TICKET
        </button>


        <button
            type="button"
            id="lobbyButton"
        >
            ENTER LOBBY
        </button>


    </div>


    <button
        type="button"
        class="return-button"
        onclick="location.href='index.html'"
    >
        ← RETURN TO NAVIGATION
    </button>


</main>


<script>


/* =========================================================
   ELEMENTOS
   ========================================================= */


const canvas =
    document.getElementById("ticketCanvas");


const ctx =
    canvas.getContext("2d");


const loadingMessage =
    document.getElementById("loadingMessage");


const ticketInfo =
    document.getElementById("ticketInfo");


const downloadButton =
    document.getElementById("downloadButton");


const lobbyButton =
    document.getElementById("lobbyButton");


/* =========================================================
   PASAJERO
   ========================================================= */


const savedPassenger =
    localStorage.getItem("currentPassenger");


if (!savedPassenger) {

    loadingMessage.textContent =
        "No registration was found.";

    downloadButton.style.display =
        "none";

    lobbyButton.style.display =
        "none";

    throw new Error(
        "No passenger registration found."
    );

}


let passengerData;


try {

    passengerData =
        JSON.parse(savedPassenger);

} catch (error) {

    loadingMessage.textContent =
        "The passenger registration is invalid.";

    downloadButton.style.display =
        "none";

    lobbyButton.style.display =
        "none";

    throw error;

}


/* =========================================================
   CLASE
   ========================================================= */


function drawClass() {

    const random =
        Math.random() * 100;


    if (random < 15) {

        return "first";

    }


    if (random < 50) {

        return "second";

    }


    return "third";

}


/* =========================================================
   PLANTILLAS
   ========================================================= */


const ticketTemplates = {


    first: [

        {
            letter: "A",
            image:
                "assets/tickets/ticket_first_a.png",
            prefix: "AF"
        },

        {
            letter: "B",
            image:
                "assets/tickets/ticket_first_b.png",
            prefix: "BF"
        },

        {
            letter: "C",
            image:
                "assets/tickets/ticket_first_c.png",
            prefix: "CF"
        }

    ],


    second: [

        {
            letter: "D",
            image:
                "assets/tickets/ticket_second_d.png",
            prefix: "DS"
        },

        {
            letter: "E",
            image:
                "assets/tickets/ticket_second_e.png",
            prefix: "ES"
        },

        {
            letter: "F",
            image:
                "assets/tickets/ticket_second_f.png",
            prefix: "FS"
        }

    ],


    third: [

        {
            letter: "G",
            image:
                "assets/tickets/ticket_third_g.png",
            prefix: "GT"
        },

        {
            letter: "H",
            image:
                "assets/tickets/ticket_third_h.png",
            prefix: "HT"
        },

        {
            letter: "I",
            image:
                "assets/tickets/ticket_third_i.png",
            prefix: "IT"
        }

    ]

};


/* =========================================================
   CAMAROTES
   ========================================================= */


const roomRanges = {


    first: {
        min: 1,
        max: 15
    },


    second: {
        min: 16,
        max: 50
    },


    third: {
        min: 51,
        max: 100
    }

};


/* =========================================================
   CAMAROTE DISPONIBLE
   ========================================================= */


function getUsedRooms() {

    const stored =
        localStorage.getItem("usedRooms");


    if (!stored) {

        return [];

    }


    try {

        const rooms =
            JSON.parse(stored);


        if (!Array.isArray(rooms)) {

            return [];

        }


        return rooms;

    } catch {

        return [];

    }

}


function saveUsedRooms(rooms) {

    localStorage.setItem(
        "usedRooms",
        JSON.stringify(rooms)
    );

}


function getAvailableRoom(className) {


    const range =
        roomRanges[className];


    const usedRooms =
        getUsedRooms();


    const available = [];


    for (
        let number = range.min;
        number <= range.max;
        number++
    ) {


        if (
            !usedRooms.includes(number)
        ) {

            available.push(number);

        }

    }


    if (
        available.length === 0
    ) {

        return null;

    }


    const randomIndex =
        Math.floor(
            Math.random() *
            available.length
        );


    const room =
        available[randomIndex];


    usedRooms.push(room);


    saveUsedRooms(usedRooms);


    return room;

}


/* =========================================================
   FORMATO
   ========================================================= */


function formatRoomNumber(number) {

    return String(number)
        .padStart(3, "0");

}


/* =========================================================
   FECHA Y HORA
   ========================================================= */


const now =
    new Date();


const day =
    String(
        now.getDate()
    ).padStart(2, "0");


const month =
    String(
        now.getMonth() + 1
    ).padStart(2, "0");


const year =
    now.getFullYear();


const hours =
    String(
        now.getHours()
    ).padStart(2, "0");


const minutes =
    String(
        now.getMinutes()
    ).padStart(2, "0");


const registrationDate =
    `${day}/${month}/${year}`;


const registrationTime =
    `${hours}:${minutes}`;


/* =========================================================
   GENERAR CLASE
   ========================================================= */


const className =
    drawClass();


/* =========================================================
   GENERAR CAMAROTE
   ========================================================= */


const roomNumber =
    getAvailableRoom(
        className
    );


if (
    roomNumber === null
) {

    loadingMessage.textContent =
        "There are no available places in this class.";

    downloadButton.style.display =
        "none";

    lobbyButton.style.display =
        "none";

    throw new Error(
        "No available room."
    );

}


const formattedRoom =
    formatRoomNumber(
        roomNumber
    );


/* =========================================================
   ELEGIR PLANTILLA
   ========================================================= */


const templates =
    ticketTemplates[className];


const selectedTemplate =
    templates[
        Math.floor(
            Math.random() *
            templates.length
        )
    ];


/* =========================================================
   DATOS DEL BOLETO
   ========================================================= */


const passenger =
    passengerData.characterName ||
    "PASAJERO";


const category =
    passengerData.category ||
    "PASAJERO";


const destination =
    passengerData.destination ||
    "REMOTO";


const cabin =
    `${selectedTemplate.letter}-${formattedRoom}`;


const code =
    `${selectedTemplate.prefix}-${day}${month}${formattedRoom}`;


/* =========================================================
   GUARDAR BOLETO NUEVO
   ========================================================= */


const generatedTicket = {


    class:
        className,


    template:
        selectedTemplate.letter,


    image:
        selectedTemplate.image,


    prefix:
        selectedTemplate.prefix,


    passenger:
        passenger,


    category:
        category,


    cabin:
        cabin,


    roomNumber:
        roomNumber,


    destination:
        destination,


    date:
        registrationDate,


    time:
        registrationTime,


    code:
        code

};


localStorage.setItem(
    "generatedTicket",
    JSON.stringify(
        generatedTicket
    )
);


/* =========================================================
   CARGAR PNG
   ========================================================= */


const ticketImage =
    new Image();


ticketImage.onload =
    function () {


        /* -----------------------------------------------
           TAMAÑO REAL
           ----------------------------------------------- */


        canvas.width =
            ticketImage.naturalWidth;


        canvas.height =
            ticketImage.naturalHeight;


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.drawImage(
            ticketImage,
            0,
            0
        );


        /* -----------------------------------------------
           TEXTO
           ----------------------------------------------- */


        ctx.fillStyle =
            "#171717";


        ctx.textBaseline =
            "middle";


        ctx.textAlign =
            "left";


        ctx.font =
            "bold 26px Georgia, serif";


        /* -----------------------------------------------
           PASAJERO
           ----------------------------------------------- */


        ctx.fillText(
            passenger,
            355,
            219
        );


        /* -----------------------------------------------
           CATEGORÍA
           ----------------------------------------------- */


        ctx.fillText(
            category,
            355,
            275
        );


        /* -----------------------------------------------
           CAMAROTE
           ----------------------------------------------- */


        ctx.fillText(
            cabin,
            555,
            330
        );


        /* -----------------------------------------------
           DESTINO
           ----------------------------------------------- */


        ctx.fillText(
            destination,
            525,
            386
        );


        /* -----------------------------------------------
           FECHA
           ----------------------------------------------- */


        ctx.font =
            "bold 24px Georgia, serif";


        ctx.textAlign =
            "center";


        ctx.fillText(
            registrationDate,
            1300,
            288
        );


        /* -----------------------------------------------
           CÓDIGO
           ----------------------------------------------- */


        /*
         * La plantilla ya contiene AF-, BF-, etc.
         * Por eso solamente se coloca la parte numérica.
         */


        const codeNumber =
            `${day}${month}${formattedRoom}`;


        ctx.fillText(
            codeNumber,
            1300,
            382
        );


        ctx.textAlign =
            "left";


        /* -----------------------------------------------
           INFORMACIÓN
           ----------------------------------------------- */


        loadingMessage.style.display =
            "none";


        ticketInfo.innerHTML = `

            <strong>
                Ticket generated successfully.
            </strong>

            <br>

            Class:
            ${className.toUpperCase()}

            <br>

            Cabin:
            ${cabin}

            <br>

            Date:
            ${registrationDate}

            <br>

            Time:
            ${registrationTime}

            <br>

            Code:
            ${code}

        `;

    };


/* =========================================================
   ERROR PNG
   ========================================================= */


ticketImage.onerror =
    function () {


        loadingMessage.textContent =
            "The ticket image could not be loaded.";


        downloadButton.style.display =
            "none";


        lobbyButton.style.display =
            "none";


        console.error(
            "Could not load ticket image:",
            selectedTemplate.image
        );

    };


/* =========================================================
   IMPORTANTE:
   LA IMAGEN SE TOMA DIRECTAMENTE
   DE LA PLANTILLA ACTUAL.
   ========================================================= */


ticketImage.src =
    selectedTemplate.image;


/* =========================================================
   DESCARGAR PNG
   ========================================================= */


downloadButton.addEventListener(
    "click",
    function () {


        if (
            !canvas.width ||
            !canvas.height
        ) {

            alert(
                "The ticket is still generating."
            );

            return;

        }


        const link =
            document.createElement("a");


        link.download =
            `White-Star-Ticket-${code}.png`;


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        link.click();

    }
);


/* =========================================================
   LOBBY
   ========================================================= */


lobbyButton.addEventListener(
    "click",
    function () {

        window.location.href =
            "index.html";

    }
);


</script>


</body>

    </html>
