<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your White Star Ticket</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .ticket-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .ticket-confirmation {
            width: 100%;
            max-width: 1000px;
            margin: 30px auto;
            padding: 25px;
            box-sizing: border-box;
            border: 2px solid #c9a227;
            border-radius: 12px;
        }

        .ticket-confirmation h3 {
            margin: 0 0 20px;
            font-size: 28px;
        }

        .character-display {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .ticket-wrapper {
            width: 100%;
            overflow-x: auto;
            margin: 20px auto;
        }

        #ticketCanvas {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .ticket-details {
            margin: 25px auto 5px;
            font-size: 18px;
            line-height: 1.8;
        }

        .ticket-loading,
        .ticket-error {
            font-size: 18px;
            margin: 30px;
        }

        .ticket-error {
            font-weight: bold;
        }

        .ticket-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .ticket-actions button {
            padding: 12px 22px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>


<body>

<main class="ticket-page">

    <h1>North Star Navigation</h1>

    <h2>Your Passenger Ticket</h2>

    <hr>


    <p
        id="loadingMessage"
        class="ticket-loading"
    >
        Generating your ticket...
    </p>


    <section
        id="ticketConfirmation"
        class="ticket-confirmation"
        style="display:none;"
    >

        <h3>
            Ticket generated successfully.
        </h3>


        <div
            id="characterDisplay"
            class="character-display"
        ></div>


        <div class="ticket-wrapper">

            <canvas
                id="ticketCanvas"
            ></canvas>

        </div>


        <div
            id="ticketInfo"
            class="ticket-details"
        ></div>

    </section>


    <div class="ticket-actions">

        <button
            type="button"
            id="downloadButton"
            style="display:none;"
        >
            DOWNLOAD COMPLETE TICKET
        </button>


        <button
            type="button"
            id="lobbyButton"
        >
            ENTER LOBBY
        </button>

    </div>


    <button
        type="button"
        onclick="window.location.href='index.html'"
    >
        ← RETURN TO NAVIGATION
    </button>


</main>


<script>

"use strict";


/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas =
    document.getElementById("ticketCanvas");

const ctx =
    canvas.getContext("2d");

const loadingMessage =
    document.getElementById("loadingMessage");

const ticketConfirmation =
    document.getElementById("ticketConfirmation");

const characterDisplay =
    document.getElementById("characterDisplay");

const ticketInfo =
    document.getElementById("ticketInfo");

const downloadButton =
    document.getElementById("downloadButton");

const lobbyButton =
    document.getElementById("lobbyButton");


/* =========================================================
   PASSENGER
   ========================================================= */

const savedPassenger =
    localStorage.getItem("currentPassenger");


if (!savedPassenger) {

    loadingMessage.textContent =
        "No passenger registration was found.";

    loadingMessage.className =
        "ticket-error";

    lobbyButton.style.display =
        "none";

    throw new Error(
        "No passenger registration found."
    );

}


let passengerData;


try {

    passengerData =
        JSON.parse(savedPassenger);

} catch (error) {

    loadingMessage.textContent =
        "The passenger registration is invalid.";

    loadingMessage.className =
        "ticket-error";

    lobbyButton.style.display =
        "none";

    throw error;

}


const passenger =
    String(
        passengerData.characterName || ""
    ).trim();


if (!passenger) {

    loadingMessage.textContent =
        "A Character Name is required.";

    loadingMessage.className =
        "ticket-error";

    lobbyButton.style.display =
        "none";

    throw new Error(
        "Character Name is missing."
    );

}


/* =========================================================
   CLASS
   ========================================================= */

function drawClass() {

    const random =
        Math.random() * 100;


    if (random < 15) {

        return "first";

    }


    if (random < 50) {

        return "second";

    }


    return "third";

}


/* =========================================================
   TICKET TEMPLATES
   ========================================================= */

const ticketTemplates = {

    first: [

        {
            letter: "A",
            image: "assets/tickets/ticket_first_a.png",
            prefix: "AF"
        },

        {
            letter: "B",
            image: "assets/tickets/ticket_first_b.png",
            prefix: "BF"
        },

        {
            letter: "C",
            image: "assets/tickets/ticket_first_c.png",
            prefix: "CF"
        }

    ],

    second: [

        {
            letter: "D",
            image: "assets/tickets/ticket_second_d.png",
            prefix: "DS"
        },

        {
            letter: "E",
            image: "assets/tickets/ticket_second_e.png",
            prefix: "ES"
        },

        {
            letter: "F",
            image: "assets/tickets/ticket_second_f.png",
            prefix: "FS"
        }

    ],

    third: [

        {
            letter: "G",
            image: "assets/tickets/ticket_third_g.png",
            prefix: "GT"
        },

        {
            letter: "H",
            image: "assets/tickets/ticket_third_h.png",
            prefix: "HT"
        },

        {
            letter: "I",
            image: "assets/tickets/ticket_third_i.png",
            prefix: "IT"
        }

    ]

};


/* =========================================================
   ROOM RANGES
   ========================================================= */

const roomRanges = {

    first: {
        min: 1,
        max: 15
    },

    second: {
        min: 16,
        max: 50
    },

    third: {
        min: 51,
        max: 100
    }

};


/* =========================================================
   USED ROOMS
   ========================================================= */

function getUsedRooms() {

    const stored =
        localStorage.getItem("usedRooms");


    if (!stored) {

        return [];

    }


    try {

        const rooms =
            JSON.parse(stored);


        return Array.isArray(rooms)
            ? rooms
            : [];

    } catch {

        return [];

    }

}


function saveUsedRooms(rooms) {

    localStorage.setItem(
        "usedRooms",
        JSON.stringify(rooms)
    );

}


/* =========================================================
   AVAILABLE ROOM
   ========================================================= */

function getAvailableRoom(className) {

    const range =
        roomRanges[className];

    const usedRooms =
        getUsedRooms();

    const available =
        [];


    for (
        let number = range.min;
        number <= range.max;
        number++
    ) {

        if (
            !usedRooms.includes(number)
        ) {

            available.push(number);

        }

    }


    if (
        available.length === 0
    ) {

        return null;

    }


    const room =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    usedRooms.push(room);

    saveUsedRooms(usedRooms);


    return room;

}


function formatRoomNumber(number) {

    return String(number)
        .padStart(3, "0");

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   DATE / TIME
   ========================================================= */

const now =
    new Date();


const day =
    String(
        now.getDate()
    ).padStart(2, "0");


const month =
    String(
        now.getMonth() + 1
    ).padStart(2, "0");


const year =
    now.getFullYear();


const hours =
    String(
        now.getHours()
    ).padStart(2, "0");


const minutes =
    String(
        now.getMinutes()
    ).padStart(2, "0");


const registrationDate =
    `${day}/${month}/${year}`;


const registrationTime =
    `${hours}:${minutes}`;


/* =========================================================
   GENERATE TICKET DATA
   ========================================================= */

const className =
    drawClass();


const roomNumber =
    getAvailableRoom(className);


if (roomNumber === null) {

    loadingMessage.textContent =
        "There are no available places in this class.";

    loadingMessage.className =
        "ticket-error";

    lobbyButton.style.display =
        "none";

    throw new Error(
        "No available room."
    );

}


const formattedRoom =
    formatRoomNumber(roomNumber);


const templates =
    ticketTemplates[className];


const selectedTemplate =
    templates[
        Math.floor(
            Math.random() *
            templates.length
        )
    ];


const category =
    "PASAJERO";


const destination =
    "REMOTO";


const cabin =
    `${selectedTemplate.letter}-${formattedRoom}`;


const code =
    `${selectedTemplate.prefix}-${day}${month}${formattedRoom}`;


/* =========================================================
   SAVE GENERATED TICKET
   ========================================================= */

const generatedTicket = {

    class:
        className,

    template:
        selectedTemplate.letter,

    passenger:
        passenger,

    category:
        category,

    cabin:
        cabin,

    roomNumber:
        roomNumber,

    destination:
        destination,

    date:
        registrationDate,

    time:
        registrationTime,

    code:
        code

};


localStorage.setItem(
    "generatedTicket",
    JSON.stringify(
        generatedTicket
    )
);


/* =========================================================
   IMAGE
   ========================================================= */

const ticketImage =
    new Image();


ticketImage.onload =
    function () {


        canvas.width =
            ticketImage.naturalWidth;

        canvas.height =
            ticketImage.naturalHeight;


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.drawImage(
            ticketImage,
            0,
            0
        );


        /* =================================================
           PERSONALIZED TEXT
           ================================================= */

        ctx.fillStyle =
            "#171717";

        ctx.textBaseline =
            "middle";

        ctx.textAlign =
            "left";

        ctx.font =
            "bold 26px Georgia, serif";


        /* CHARACTER */

        ctx.fillText(
            passenger,
            355,
            219
        );


        /* CATEGORY */

        ctx.fillText(
            category,
            355,
            275
        );


        /* CABIN */

        ctx.fillText(
            cabin,
            555,
            330
        );


        /* DESTINATION */

        ctx.fillText(
            destination,
            525,
            386
        );


        /* RIGHT PANEL */

        ctx.textAlign =
            "center";

        ctx.font =
            "bold 24px Georgia, serif";


        /* DATE */

        ctx.fillText(
            registrationDate,
            1300,
            320
        );


        /* CODE */

        ctx.fillText(
            code,
            1300,
            418
        );


        /* =================================================
           SHOW
           ================================================= */

        loadingMessage.style.display =
            "none";


        ticketConfirmation.style.display =
            "block";


        downloadButton.style.display =
            "inline-block";


        characterDisplay.textContent =
            "Character: " + passenger;


        ticketInfo.innerHTML = `

            <strong>Class:</strong>
            ${escapeHTML(
                className.toUpperCase()
            )}

            <br>

            <strong>Cabin:</strong>
            ${escapeHTML(cabin)}

            <br>

            <strong>Date:</strong>
            ${escapeHTML(registrationDate)}

            <br>

            <strong>Time:</strong>
            ${escapeHTML(registrationTime)}

            <br>

            <strong>Code:</strong>
            ${escapeHTML(code)}

        `;

    };


/* =========================================================
   IMAGE ERROR
   ========================================================= */

ticketImage.onerror =
    function () {

        loadingMessage.textContent =
            "The ticket template could not be loaded.";

        loadingMessage.className =
            "ticket-error";

        ticketConfirmation.style.display =
            "none";

        downloadButton.style.display =
            "none";

        console.error(
            "Ticket image failed to load:",
            selectedTemplate.image
        );

    };


/* =========================================================
   START IMAGE
   ========================================================= */

ticketImage.src =
    selectedTemplate.image;


/* =========================================================
   DOWNLOAD COMPLETE TICKET
   ========================================================= */

downloadButton.addEventListener(
    "click",
    function () {


        if (
            !ticketImage.complete ||
            ticketImage.naturalWidth === 0
        ) {

            alert(
                "Please wait until the ticket has loaded."
            );

            return;

        }


        const width =
            1600;


        const ticketWidth =
            1400;


        const scale =
            ticketWidth /
            ticketImage.naturalWidth;


        const ticketHeight =
            ticketImage.naturalHeight *
            scale;


        const ticketX =
            (width - ticketWidth) / 2;


        const ticketY =
            175;


        const height =
            Math.ceil(
                ticketY +
                ticketHeight +
                250
            );


        const downloadCanvas =
            document.createElement("canvas");


        const downloadCtx =
            downloadCanvas.getContext("2d");


        downloadCanvas.width =
            width;

        downloadCanvas.height =
            height;


        /* BACKGROUND */

        downloadCtx.fillStyle =
            "#0b1b2b";

        downloadCtx.fillRect(
            0,
            0,
            width,
            height
        );


        /* BORDER */

        downloadCtx.strokeStyle =
            "#c9a227";

        downloadCtx.lineWidth =
            5;

        downloadCtx.strokeRect(
            20,
            20,
            width - 40,
            height - 40
        );


        /* TITLE */

        downloadCtx.fillStyle =
            "#ffffff";

        downloadCtx.textAlign =
            "center";

        downloadCtx.textBaseline =
            "alphabetic";

        downloadCtx.font =
            "bold 42px Georgia, serif";

        downloadCtx.fillText(
            "NORTH STAR NAVIGATION",
            width / 2,
            75
        );


        /* CHARACTER */

        downloadCtx.font =
            "bold 30px Georgia, serif";

        downloadCtx.fillText(
            "Character: " + passenger,
            width / 2,
            125
        );


        /* TICKET */

        downloadCtx.drawImage(
            ticketImage,
            ticketX,
            ticketY,
            ticketWidth,
            ticketHeight
        );


        /* PERSONALIZED TICKET */

        downloadCtx.fillStyle =
            "#171717";

        downloadCtx.textAlign =
            "left";

        downloadCtx.textBaseline =
            "middle";

        downloadCtx.font =
            `bold ${26 * scale}px Georgia, serif`;


        downloadCtx.fillText(
            passenger,
            ticketX + (355 * scale),
            ticketY + (219 * scale)
        );


        downloadCtx.fillText(
            category,
            ticketX + (355 * scale),
            ticketY + (275 * scale)
        );


        downloadCtx.fillText(
            cabin,
            ticketX + (555 * scale),
            ticketY + (330 * scale)
        );


        downloadCtx.fillText(
            destination,
            ticketX + (525 * scale),
            ticketY + (386 * scale)
        );


        downloadCtx.textAlign =
            "center";

        downloadCtx.font =
            `bold ${24 * scale}px Georgia, serif`;


        downloadCtx.fillText(
            registrationDate,
            ticketX + (1300 * scale),
            ticketY + (320 * scale)
        );


        downloadCtx.fillText(
            code,
            ticketX + (1300 * scale),
            ticketY + (418 * scale)
        );


        /* INFORMATION */

        const infoY =
            ticketY +
            ticketHeight +
            55;


        downloadCtx.fillStyle =
            "#ffffff";

        downloadCtx.font =
            "22px Georgia, serif";

        downloadCtx.textBaseline =
            "alphabetic";


        downloadCtx.fillText(
            `Class: ${className.toUpperCase()}   |   Cabin: ${cabin}`,
            width / 2,
            infoY
        );


        downloadCtx.fillText(
            `Date: ${registrationDate}   |   Time: ${registrationTime}`,
            width / 2,
            infoY + 38
        );


        downloadCtx.fillText(
            `Code: ${code}`,
            width / 2,
            infoY + 76
        );


        /* DOWNLOAD */

        const link =
            document.createElement("a");


        link.download =
            `White-Star-Ticket-${code}.png`;


        link.href =
            downloadCanvas.toDataURL(
                "image/png"
            );


        document.body.appendChild(link);

        link.click();

        link.remove();

    }
);

</script>

</body>

</html>
