<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your White Star Ticket</title>

    <style>

        body {
            margin: 0;
            background: #0d1b2a;
            color: #f5f1e8;
            font-family: Georgia, serif;
            text-align: center;
        }

        .ticket-page {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 15px 50px;
            box-sizing: border-box;
        }

        h1 {
            color: #d4af37;
            font-size: 52px;
            margin: 15px 0 0;
        }

        h2 {
            font-size: 34px;
            font-weight: normal;
            margin: 10px 0 35px;
        }

        hr {
            border: 0;
            border-top: 1px solid rgba(255,255,255,.25);
            margin-bottom: 30px;
        }

        .ticket-loading {
            font-size: 20px;
            margin: 30px 0;
        }

        /* =================================================
           CUADRO COMPLETO
           ================================================= */

        .ticket-card {
            width: 100%;
            max-width: 1000px;
            margin: 30px auto;
            padding: 35px;
            box-sizing: border-box;

            background: #f5f1e8;
            color: #171717;

            border: 3px solid #b08d32;
            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.35);
        }

        .ticket-card-title {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .ticket-card-subtitle {
            font-size: 17px;
            margin-bottom: 25px;
        }

        /* =================================================
           NOMBRE DEL PJ
           ================================================= */

        .character-box {
            border: 2px solid #171717;
            padding: 15px;
            margin-bottom: 25px;
            background: #ffffff;
        }

        .character-label {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .character-name {
            font-size: 27px;
            font-weight: bold;
        }

        /* =================================================
           BOLETO ORIGINAL
           ================================================= */

        .ticket-image-container {
            width: 100%;
            margin: 20px auto;
            overflow: hidden;
        }

        #ticketImage {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
        }

        /* =================================================
           INFORMACIÓN
           ================================================= */

        .ticket-information {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #171717;
        }

        .ticket-success {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .ticket-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 700px;
            margin: 0 auto;
        }

        .detail {
            background: #ffffff;
            border: 1px solid #999;
            padding: 10px;
        }

        .detail-label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 18px;
        }

        /* =================================================
           BOTONES
           ================================================= */

        .ticket-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .ticket-actions button,
        .return-button {
            padding: 13px 25px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #888;
            background: #f1f1f1;
            color: #111;
        }

        @media (max-width: 650px) {

            .ticket-card {
                padding: 18px;
            }

            .ticket-card-title {
                font-size: 24px;
            }

            .character-name {
                font-size: 22px;
            }

            .ticket-details {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<main class="ticket-page">

    <h1>
        North Star Navigation
    </h1>

    <h2>
        Your Passenger Ticket
    </h2>

    <hr>

    <p
        id="loadingMessage"
        class="ticket-loading"
    >
        Generating your ticket...
    </p>


    <!-- =====================================================
         CUADRO COMPLETO
         ===================================================== -->

    <section
        id="ticketCard"
        class="ticket-card"
        style="display:none;"
    >

        <div class="ticket-card-title">
            NORTH STAR NAVIGATION
        </div>

        <div class="ticket-card-subtitle">
            PASSENGER REGISTRATION
        </div>


        <!-- =================================================
             NOMBRE DEL PERSONAJE
             ================================================= -->

        <div class="character-box">

            <div class="character-label">
                CHARACTER
            </div>

            <div
                id="characterName"
                class="character-name"
            ></div>

        </div>


        <!-- =================================================
             BOLETO ORIGINAL
             ================================================= -->

        <div class="ticket-image-container">

            <img
                id="ticketImage"
                alt="Passenger Ticket"
            >

        </div>


        <!-- =================================================
             INFORMACIÓN
             ================================================= -->

        <div class="ticket-information">

            <div class="ticket-success">
                Ticket generated successfully.
            </div>


            <div class="ticket-details">

                <div class="detail">

                    <span class="detail-label">
                        CLASS
                    </span>

                    <span
                        id="ticketClass"
                        class="detail-value"
                    ></span>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        CABIN
                    </span>

                    <span
                        id="ticketCabin"
                        class="detail-value"
                    ></span>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        DATE
                    </span>

                    <span
                        id="ticketDate"
                        class="detail-value"
                    ></span>

                </div>


                <div class="detail">

                    <span class="detail-label">
                        TIME
                    </span>

                    <span
                        id="ticketTime"
                        class="detail-value"
                    ></span>

                </div>


                <div
                    class="detail"
                    style="grid-column: 1 / -1;"
                >

                    <span class="detail-label">
                        CODE
                    </span>

                    <span
                        id="ticketCode"
                        class="detail-value"
                    ></span>

                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         BOTONES
         ===================================================== -->

    <div class="ticket-actions">

        <button
            type="button"
            id="downloadButton"
            style="display:none;"
        >
            DOWNLOAD TICKET
        </button>


        <button
            type="button"
            id="lobbyButton"
        >
            ENTER LOBBY
        </button>

    </div>


    <button
        type="button"
        class="return-button"
        onclick="location.href='index.html'"
    >
        ← RETURN TO NAVIGATION
    </button>

</main>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const loadingMessage =
    document.getElementById("loadingMessage");

const ticketCard =
    document.getElementById("ticketCard");

const ticketImage =
    document.getElementById("ticketImage");

const characterNameElement =
    document.getElementById("characterName");

const ticketClass =
    document.getElementById("ticketClass");

const ticketCabin =
    document.getElementById("ticketCabin");

const ticketDate =
    document.getElementById("ticketDate");

const ticketTime =
    document.getElementById("ticketTime");

const ticketCode =
    document.getElementById("ticketCode");

const downloadButton =
    document.getElementById("downloadButton");

const lobbyButton =
    document.getElementById("lobbyButton");


/* =========================================================
   REGISTRO
   ========================================================= */

const savedPassenger =
    localStorage.getItem("currentPassenger");


if (!savedPassenger) {

    loadingMessage.textContent =
        "No registration was found.";

    lobbyButton.style.display =
        "none";

    throw new Error(
        "No passenger registration found."
    );

}


let passengerData;


try {

    passengerData =
        JSON.parse(savedPassenger);

} catch (error) {

    loadingMessage.textContent =
        "The passenger registration is invalid.";

    lobbyButton.style.display =
        "none";

    throw error;

}


/* =========================================================
   NOMBRE DEL PJ
   ========================================================= */

const passenger =
    passengerData.characterName
    ? passengerData.characterName.trim()
    : "";


if (!passenger) {

    loadingMessage.textContent =
        "Character name is required.";

    lobbyButton.style.display =
        "none";

    throw new Error(
        "Character name is required."
    );

}


/* =========================================================
   DISTRIBUCIÓN DE CLASE
   FIRST 15%
   SECOND 35%
   THIRD 50%
   ========================================================= */

function drawClass() {

    const random =
        Math.random() * 100;

    if (random < 15) {
        return "first";
    }

    if (random < 50) {
        return "second";
    }

    return "third";
}


/* =========================================================
   BOLETOS
   ========================================================= */

const ticketTemplates = {

    first: [

        {
            letter: "A",
            image:
                "assets/tickets/ticket_first_a.png",
            prefix: "AF"
        },

        {
            letter: "B",
            image:
                "assets/tickets/ticket_first_b.png",
            prefix: "BF"
        },

        {
            letter: "C",
            image:
                "assets/tickets/ticket_first_c.png",
            prefix: "CF"
        }

    ],

    second: [

        {
            letter: "D",
            image:
                "assets/tickets/ticket_second_d.png",
            prefix: "DS"
        },

        {
            letter: "E",
            image:
                "assets/tickets/ticket_second_e.png",
            prefix: "ES"
        },

        {
            letter: "F",
            image:
                "assets/tickets/ticket_second_f.png",
            prefix: "FS"
        }

    ],

    third: [

        {
            letter: "G",
            image:
                "assets/tickets/ticket_third_g.png",
            prefix: "GT"
        },

        {
            letter: "H",
            image:
                "assets/tickets/ticket_third_h.png",
            prefix: "HT"
        },

        {
            letter: "I",
            image:
                "assets/tickets/ticket_third_i.png",
            prefix: "IT"
        }

    ]

};


/* =========================================================
   RANGOS DE CAMAROTE
   ========================================================= */

const roomRanges = {

    first: {
        min: 1,
        max: 15
    },

    second: {
        min: 16,
        max: 50
    },

    third: {
        min: 51,
        max: 100
    }

};


/* =========================================================
   CAMAROTES UTILIZADOS
   ========================================================= */

function getUsedRooms() {

    const stored =
        localStorage.getItem("usedRooms");

    if (!stored) {
        return [];
    }

    try {

        const rooms =
            JSON.parse(stored);

        return Array.isArray(rooms)
            ? rooms
            : [];

    } catch {

        return [];

    }

}


function saveUsedRooms(rooms) {

    localStorage.setItem(
        "usedRooms",
        JSON.stringify(rooms)
    );

}


function getAvailableRoom(className) {

    const range =
        roomRanges[className];

    const usedRooms =
        getUsedRooms();

    const available = [];


    for (
        let number = range.min;
        number <= range.max;
        number++
    ) {

        if (
            !usedRooms.includes(number)
        ) {

            available.push(number);

        }

    }


    if (available.length === 0) {
        return null;
    }


    const randomIndex =
        Math.floor(
            Math.random() *
            available.length
        );


    const room =
        available[randomIndex];


    usedRooms.push(room);

    saveUsedRooms(usedRooms);


    return room;

}


/* =========================================================
   FORMATO
   ========================================================= */

function formatRoomNumber(number) {

    return String(number)
        .padStart(3, "0");

}


/* =========================================================
   FECHA Y HORA
   ========================================================= */

const now =
    new Date();

const day =
    String(now.getDate())
        .padStart(2, "0");

const month =
    String(now.getMonth() + 1)
        .padStart(2, "0");

const year =
    now.getFullYear();

const hours =
    String(now.getHours())
        .padStart(2, "0");

const minutes =
    String(now.getMinutes())
        .padStart(2, "0");


const registrationDate =
    `${day}/${month}/${year}`;

const registrationTime =
    `${hours}:${minutes}`;


/* =========================================================
   GENERAR CLASE Y CAMAROTE
   ========================================================= */

const className =
    drawClass();


const roomNumber =
    getAvailableRoom(
        className
    );


if (roomNumber === null) {

    loadingMessage.textContent =
        "There are no available places in this class.";

    lobbyButton.style.display =
        "none";

    throw new Error(
        "No available room."
    );

}


const formattedRoom =
    formatRoomNumber(
        roomNumber
    );


/* =========================================================
   SELECCIONAR BOLETO
   ========================================================= */

const templates =
    ticketTemplates[className];


const selectedTemplate =
    templates[
        Math.floor(
            Math.random() *
            templates.length
        )
    ];


/* =========================================================
   DATOS
   ========================================================= */

const cabin =
    `${selectedTemplate.letter}-${formattedRoom}`;


const code =
    `${selectedTemplate.prefix}-${day}${month}${formattedRoom}`;


/* =========================================================
   MOSTRAR NOMBRE
   ========================================================= */

characterNameElement.textContent =
    passenger;


/* =========================================================
   MOSTRAR INFORMACIÓN
   ========================================================= */

ticketClass.textContent =
    className.toUpperCase();

ticketCabin.textContent =
    cabin;

ticketDate.textContent =
    registrationDate;

ticketTime.textContent =
    registrationTime;

ticketCode.textContent =
    code;


/* =========================================================
   GUARDAR BOLETO
   ========================================================= */

const generatedTicket = {

    class:
        className,

    template:
        selectedTemplate.letter,

    image:
        selectedTemplate.image,

    passenger:
        passenger,

    cabin:
        cabin,

    roomNumber:
        roomNumber,

    date:
        registrationDate,

    time:
        registrationTime,

    code:
        code

};


localStorage.setItem(
    "generatedTicket",
    JSON.stringify(
        generatedTicket
    )
);


/* =========================================================
   CARGAR BOLETO ORIGINAL
   ========================================================= */

ticketImage.onload =
    function () {

        loadingMessage.style.display =
            "none";

        ticketCard.style.display =
            "block";

        downloadButton.style.display =
            "inline-block";

    };


ticketImage.onerror =
    function () {

        loadingMessage.textContent =
            "The ticket image could not be loaded.";

        downloadButton.style.display =
            "none";

    };


ticketImage.src =
    selectedTemplate.image;


/* =========================================================
   DESCARGAR TODO EL CUADRO COMO PNG
   ========================================================= */

downloadButton.addEventListener(
    "click",
    function () {

        const exportCanvas =
            document.createElement(
                "canvas"
            );

        const exportWidth = 1600;

        const exportHeight = 1200;


        exportCanvas.width =
            exportWidth;

        exportCanvas.height =
            exportHeight;


        const exportCtx =
            exportCanvas.getContext(
                "2d"
            );


        /* Fondo */

        exportCtx.fillStyle =
            "#f5f1e8";

        exportCtx.fillRect(
            0,
            0,
            exportWidth,
            exportHeight
        );


        /* Borde */

        exportCtx.strokeStyle =
            "#b08d32";

        exportCtx.lineWidth =
            8;

        exportCtx.strokeRect(
            15,
            15,
            exportWidth - 30,
            exportHeight - 30
        );


        /* Título */

        exportCtx.fillStyle =
            "#171717";

        exportCtx.textAlign =
            "center";

        exportCtx.font =
            "bold 42px Georgia";

        exportCtx.fillText(
            "NORTH STAR NAVIGATION",
            exportWidth / 2,
            70
        );


        exportCtx.font =
            "24px Georgia";

        exportCtx.fillText(
            "PASSENGER REGISTRATION",
            exportWidth / 2,
            108
        );


        /* Nombre del
