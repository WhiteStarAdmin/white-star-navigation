<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Passenger Registration | North Star Navigation</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .registration-container {
            max-width: 600px;
            margin: 0 auto;
        }

        #passengerForm {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #passengerForm label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        #passengerForm input,
        #passengerForm select {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #aaa;
        }

        #passengerForm button {
            margin-top: 20px;
            align-self: center;
            padding: 10px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        .registration-note {
            margin-top: 18px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

    </style>

</head>


<body>

    <h1>North Star Navigation</h1>

    <h2>Passenger Registration</h2>

    <hr>


    <section class="registration-container">

        <h3>Passenger Information</h3>


        <form
            id="passengerForm"
            action="ticket.html"
            method="GET"
        >


            <label for="userName">
                Name
            </label>

            <input
                type="text"
                id="userName"
                name="userName"
                required
                autocomplete="name"
            >


            <label for="userAlias">
                User Alias
            </label>

            <input
                type="text"
                id="userAlias"
                name="userAlias"
                required
            >


            <label for="characterName">
                Character Name
            </label>

            <input
                type="text"
                id="characterName"
                name="characterName"
                required
            >


            <label for="characterAge">
                Character Age
            </label>

            <input
                type="number"
                id="characterAge"
                name="characterAge"
                min="1"
                max="120"
                required
            >


            <label for="characterGender">
                Gender
            </label>

            <select
                id="characterGender"
                name="characterGender"
                required
            >

                <option value="">
                    Select
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Non-binary">
                    Non-binary
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label for="nationality">
                Nationality
            </label>

            <input
                type="text"
                id="nationality"
                name="nationality"
                required
            >


            <label for="phone">
                User Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                required
                autocomplete="tel"
            >


            <!-- =============================================
                 AVISO
                 ============================================= -->

            <div class="registration-note">

                <strong>IMPORTANT:</strong>

                Character Name is required to identify
                the occupied character.

            </div>


            <!-- =============================================
                 CONTINUE
                 ============================================= -->

            <button
                type="submit"
                class="registration-button"
            >
                CONTINUE
            </button>


        </form>

    </section>


    <hr>


    <button
        type="button"
        onclick="window.location.href='index.html'"
    >
        ← RETURN TO NAVIGATION
    </button>


<script>

/* =========================================================
   PASSENGER REGISTRATION
   ========================================================= */

const passengerForm =
    document.getElementById(
        "passengerForm"
    );


passengerForm.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        /* =============================================
           GET DATA
           ============================================= */

        const passengerData = {

            userName:
                document
                    .getElementById("userName")
                    .value
                    .trim(),

            userAlias:
                document
                    .getElementById("userAlias")
                    .value
                    .trim(),

            characterName:
                document
                    .getElementById("characterName")
                    .value
                    .trim(),

            characterAge:
                Number(
                    document
                        .getElementById("characterAge")
                        .value
                ),

            characterGender:
                document
                    .getElementById("characterGender")
                    .value,

            nationality:
                document
                    .getElementById("nationality")
                    .value
                    .trim(),

            phone:
                document
                    .getElementById("phone")
                    .value
                    .trim()

        };


        /* =============================================
           VERIFY REQUIRED INFORMATION
           ============================================= */

        if (
            !passengerData.userName ||
            !passengerData.userAlias ||
            !passengerData.characterName ||
            !passengerData.characterAge ||
            !passengerData.characterGender ||
            !passengerData.nationality ||
            !passengerData.phone
        ) {

            alert(
                "Please complete all required fields."
            );

            return;

        }


        /* =============================================
           SAVE DATA
           ============================================= */

        try {

            localStorage.setItem(
                "currentPassenger",
                JSON.stringify(
                    passengerData
                )
            );

        } catch (error) {

            alert(
                "The registration could not be saved."
            );

            console.error(error);

            return;

        }


        /* =============================================
           GO TO TICKET
           ============================================= */

        window.location.href =
            "ticket.html";

    }
);

</script>


</body>

</html>
